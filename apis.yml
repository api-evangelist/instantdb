apis:
- aid: instantdb:instantdb-realtime-sync-api
  name: InstantDB Realtime Sync API
  tags:
  - Realtime
  - WebSocket
  - Sync
  - Presence
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.instantdb.com/essays/architecture
  baseURL: wss://api.instantdb.com/runtime/session
  properties:
  - url: https://www.instantdb.com/essays/architecture
    type: Documentation
  - url: https://www.instantdb.com/docs/presence-and-topics
    type: APIReference
  - url: asyncapi/instantdb-asyncapi.yml
    type: AsyncAPI
  description: >-
    The realtime sync transport - a persistent WebSocket at wss://api.instantdb.com/runtime/session over
    which the client Reactor sends init, add-query, transact, and presence ops and the server streams
    query novelty (refresh-ok), presence, and broadcasts back to subscribers.
